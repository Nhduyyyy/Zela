# Upstream cho Zela application
upstream zela_backend {
    server zela-app:80;
    keepalive 32;
}

# HTTP Server - Redirect to HTTPS (nếu có SSL) hoặc proxy trực tiếp
server {
    listen 80;
    server_name zelahahaha.site www.zelahahaha.site;

    # Logging
    access_log /var/log/nginx/zela_access.log;
    error_log /var/log/nginx/zela_error.log;

    # Client body size limit (cho file uploads)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support cho SignalR
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;

    # Static files - Nginx serve trực tiếp (tùy chọn, có thể để app serve)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|mp4|mp3)$ {
        proxy_pass http://zela_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SignalR Hubs - WebSocket support
    location ~ ^/(chathub|meetingHub|meetingChatHub|whiteboardHub|quizHub) {
        proxy_pass http://zela_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # 24 hours for long-lived connections
        proxy_send_timeout 86400;
    }

    # Main application
    location / {
        proxy_pass http://zela_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://zela_backend;
        access_log off;
    }
}


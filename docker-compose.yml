version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zela-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Str0ng_Pa$$w0rd!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - zela-network
    restart: unless-stopped

  # Zela Application
  zela-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zela-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Zela_FinalV2.0;User ID=SA;Password=Str0ng_Pa$$w0rd!;MultipleActiveResultSets=true;Encrypt=False;TrustServerCertificate=True;
      - PayOS__PartnerCode=MOMO
      - PayOS__ClientId=f53a4fe9-338b-4040-b228-9329d85fee29
      - PayOS__ApiKey=22d0e505-cdb0-4233-b190-9dc5f68a5db8
      - PayOS__Checksum=b6911d00cd425ed894e78bd680cae70f9dfa14734cdf1bb77f44f9a835d0f744
      - AppSettings__BaseUrl=http://34.124.228.222
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
      - ./wwwroot/sticker:/app/wwwroot/sticker
    depends_on:
      - sqlserver
    networks:
      - zela-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local

networks:
  zela-network:
    driver: bridge


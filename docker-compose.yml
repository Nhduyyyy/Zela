version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zela-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Str0ng_Pa$$w0rd!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - zela-network
    restart: unless-stopped

  # Zela Application
  zela-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zela-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Zela_FinalV2.0;User ID=SA;Password=Str0ng_Pa$$w0rd!;MultipleActiveResultSets=true;Encrypt=False;TrustServerCertificate=True;
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
      - ./wwwroot/sticker:/app/wwwroot/sticker
    depends_on:
      - sqlserver
    networks:
      - zela-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local

networks:
  zela-network:
    driver: bridge

